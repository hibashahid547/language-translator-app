<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Premium Translator Pro</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🌍 Premium Translator PRO</h1>
        <p>Fast • Smart • Voice Enabled</p>
    </div>

    <!-- INPUT -->
    <div class="card">

        <textarea id="inputText" placeholder="Type your text..." oninput="countChars()"></textarea>

        <div class="meta">
            <span id="charCount">0 characters</span>
        </div>

        <div class="controls">

            <select id="sourceLang">
                <option value="en">English</option>
                <option value="ur">Urdu</option>
                <option value="fr">French</option>
                <option value="es">Spanish</option>
                <option value="de">German</option>
                <option value="hi">Hindi</option>
            </select>

            <button class="swap-btn" onclick="swapLang()">⇄</button>

            <select id="targetLang">
                <option value="ur">Urdu</option>
                <option value="en">English</option>
                <option value="fr">French</option>
                <option value="es">Spanish</option>
                <option value="de">German</option>
                <option value="hi">Hindi</option>
            </select>

        </div>

        <button class="primary-btn" onclick="translateText()">Translate</button>

    </div>

    <!-- OUTPUT -->
    <div class="card output-card">

        <h3>Translation</h3>

        <div id="result">Your translation will appear here...</div>

        <div id="loader" class="loader hidden">Translating...</div>

        <!-- Voice Select -->
        <select id="voiceSelect"></select>

        <div class="buttons">
            <button onclick="copyText()">Copy</button>
            <button onclick="speakText()">🔊 Speak</button>
            <button onclick="pauseSpeech()">⏸️ Pause</button>
            <button onclick="resumeSpeech()">▶️ Resume</button>
            <button onclick="stopSpeech()">⏹️ Stop</button>
        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
